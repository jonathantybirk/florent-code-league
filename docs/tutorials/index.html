in that ends in a Splitter, use the Splitter's spare side to feed a Gunner, and share ore locations over the Store so Builder Bots aren't all working blind.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> <code>_build_gunner<\/code> below uses <code>pos.cardinal_direction_to(self.splitter_pos)<\/code> on the published page. <strong>This method does not exist<\/strong> in the installed <code>fcode<\/code> engine (confirmed by direct call at runtime \u2014 raises <code>AttributeError<\/code>). Corrected below to <code>pos.direction_to(...)<\/code> with a rotate-left/right fallback.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\nCARDINALS = [Direction.NORTH, Direction.EAST, Direction.SOUTH, Direction.WEST]\n\nSLOT_ORE_X = 0\nSLOT_ORE_Y = 1\n\ndef in_bounds(ct: Controller, pos: Position) -&gt; bool:\n    return 0 &lt;= pos.x &lt; ct.get_map_width() and 0 &lt;= pos.y &lt; ct.get_map_height()\n\nclass Player:\n    def __init__(self):\n        self.core_tile: Position | None = None\n        self.harvester_pos: Position | None = None\n        self.chain_done = False\n        self.gunner_built = False\n        self.gunner_side: Direction | None = None\n        self.splitter_pos: Position | None = None\n\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n        elif etype == EntityType.GUNNER:\n            self._run_gunner(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        if self.core_tile is None:\n            for tile in ct.get_nearby_tiles():\n                bid = ct.get_tile_building_id(tile)\n                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    self.core_tile = tile\n                    break\n\n        self._share_ore(ct, pos)\n\n        if self.harvester_pos is None:\n            self._seek_and_harvest(ct, pos)\n        elif not self.chain_done and self.core_tile is not None:\n            self._lay_conveyor_toward_core(ct, pos)\n        elif not self.gunner_built and self.splitter_pos is not None and self.gunner_side is not None:\n            self._build_gunner(ct)\n\n    def _share_ore(self, ct: Controller, pos: Position) -&gt; None:\n        for tile in ct.get_nearby_tiles():\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.get_tile_building_id(tile) is None:\n                ct.write_store(SLOT_ORE_X, tile.x)\n                ct.write_store(SLOT_ORE_Y, tile.y)\n                return\n\n    def _seek_and_harvest(self, ct: Controller, pos: Position) -&gt; None:\n        for d in CARDINALS:\n            tile = pos.add(d)\n            if not in_bounds(ct, tile):\n                continue\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                self.harvester_pos = tile\n                return\n\n        ore_tiles = [t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n        else:\n            shared_x, shared_y = ct.read_store(SLOT_ORE_X), ct.read_store(SLOT_ORE_Y)\n            target = Position(shared_x, shared_y) if (shared_x or shared_y) else None\n\n        if target is not None:\n            direction = pos.direction_to(target)\n            if ct.can_move(direction):\n                ct.move(direction)\n                return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _pick_direction(self, ct: Controller, pos: Position) -&gt; Direction | None:\n        assert self.core_tile is not None\n        dx = self.core_tile.x - pos.x\n        dy = self.core_tile.y - pos.y\n        if dx != 0:\n            d = Direction.EAST if dx &gt; 0 else Direction.WEST\n            if ct.can_move(d):\n                return d\n        if dy != 0:\n            d = Direction.SOUTH if dy &gt; 0 else Direction.NORTH\n            if ct.can_move(d):\n                return d\n        return None\n\n    def _lay_conveyor_toward_core(self, ct: Controller, pos: Position) -&gt; None:\n        # Builder bots can only build on an orthogonally adjacent tile now,\n        # never their own -- so we check every tile we could build on for\n        # the Core first, one tile further out than before, since the\n        # final relay (the Splitter) can no longer be built by standing on\n        # it either.\n        for d in CARDINALS:\n            next_pos = pos.add(d)\n            if not in_bounds(ct, next_pos):\n                continue\n            for d2 in CARDINALS:\n                neighbor = next_pos.add(d2)\n                if not in_bounds(ct, neighbor):\n                    continue\n                bid = ct.get_tile_building_id(neighbor)\n                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    if ct.can_build_splitter(next_pos, d2):\n                        ct.build_splitter(next_pos, d2)\n                        self.splitter_pos = next_pos\n                        for side in CARDINALS:\n                            if side != d2 and side != d2.opposite():\n                                self.gunner_side = side\n                                break\n                    self.chain_done = True\n                    return\n\n        direction = self._pick_direction(ct, pos)\n        if direction is None:\n            self.chain_done = True\n            return\n\n        next_pos = pos.add(direction)\n        if ct.can_build_conveyor(next_pos, direction):\n            ct.build_conveyor(next_pos, direction)\n        if ct.can_move(direction):\n            ct.move(direction)\n\n    def _build_gunner(self, ct: Controller) -&gt; None:\n        assert self.splitter_pos is not None and self.gunner_side is not None\n        pos = ct.get_position()\n        if pos != self.splitter_pos:\n            # The Splitter sits one tile ahead of us -- we stopped short of\n            # it on purpose, since it can't be built while standing on it.\n            # Splitters are bot-passable, so just walk onto it like any\n            # other tile; the Gunner build happens next round from there.\n            desired = pos.direction_to(self.splitter_pos)\n            for d in (desired, desired.rotate_left(), desired.rotate_right()):\n                if ct.can_move(d):\n                    ct.move(d)\n                    return\n            return\n\n        gunner_pos = self.splitter_pos.add(self.gunner_side)\n        if in_bounds(ct, gunner_pos) and ct.can_build_gunner(gunner_pos, self.gunner_side):\n            ct.build_gunner(gunner_pos, self.gunner_side)\n        self.gunner_built = True\n\n    def _run_gunner(self, ct: Controller) -&gt; None:\n        target = ct.get_gunner_target()\n        if target is not None and ct.can_fire(target):\n            ct.fire(target)\n<\/code><\/pre>\n<p>Nothing here is new mechanically \u2014 every piece was introduced and tested in an earlier tutorial. What's new is the state machine tying them together: each Builder Bot works through harvest \u2192 route \u2192 defend in order, tracked with a handful of instance attributes (<code>harvester_pos<\/code>, <code>chain_done<\/code>, <code>gunner_built<\/code>, ...) that persist for that unit's entire lifetime, exactly like <code>self.num_spawned<\/code> did all the way back in Tutorial 1.<\/p>\n<p>One genuinely new wrinkle: because the Splitter is now built from one tile back rather than by standing on it, <code>_build_gunner<\/code> has to walk the bot onto the Splitter's tile first (Splitters are bot-passable) before it can build the Gunner beside it \u2014 the same &quot;a build blocks this round's move, so wait a round&quot; pattern you've already seen in <code>_lay_conveyor_toward_core<\/code>. The Gunner sits on <code>gunner_side<\/code>, one of the Splitter's three output sides (the other two being the Core-facing side and the opposite of that), so it receives a stack \u2014 and ammo \u2014 whenever the Splitter's round-robin reaches that side.<\/p>\n<p>Be honest with yourself about what this bot isn't: it's not optimized, it doesn't handle every map layout, and independent Builder Bots can still collide with each other's plans. That's fine. It's a real, working demonstration of every mechanic in the game, and a legitimate base to build a stronger strategy from.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: Harvesters, conveyor chains, Splitters, and Gunners all appearing over the course of the match, Builder Bots occasionally converging on a shared ore target, and \u2014 on at least some runs \u2014 a Gunner that actually fires because its ammo pipeline is connected. Run it a few times with different seeds; results will vary, and that's expected.<\/p>\n<p>Next: where to take this from here.<\/p>\n"}, {"id": "comms-strategy/04-where-to-go-from-here", "chapter": "Comms & Strategy", "title": "Coordination & Strategy \u00b7 Step 4 of 4", "name": "Where to go from here", "body": "<h1>Coordination &amp; Strategy \u00b7 Step 4 of 4<\/h1>\n<h2>Where to go from here<\/h2>\n<p>You've now touched every major system in the game: movement and sensing, the titanium economy, conveyor logistics, turret combat, and team-wide coordination through the Global Communication Store. That's the whole rulebook \u2014 everything from here is strategy, not new mechanics.<\/p>\n<p>The platform ships a more polished reference bot at <code>bots/starter_bot.py<\/code> (or <code>bots/starter/main.py<\/code> if you ran <code>fcode starter<\/code>). It's built from the same pieces you just used, organized a little differently, and its own docstring is honest about what it doesn't do yet:<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page's second bullet reads &quot;Tune the ammo buffer: convert more titanium when enemies are near, less when you'd rather grow the economy&quot; \u2014 a holdover from the wrong team-wide-ammo model (see the corrections throughout <a href=\"../turrets-combat/01-meet-the-turrets.md\">Turrets &amp; Combat<\/a>). The actual shipped starter bot's docstring says something different; the list below quotes it directly.<\/p>\n<\/blockquote>\n<ul>\n<li>Build full conveyor chains from distant Harvesters back to the Core<\/li>\n<li>Feed ammo to gunners via conveyors so they can actually fire<\/li>\n<li>Add sentinels or launchers for stronger defense<\/li>\n<li>Explore the map systematically instead of picking random targets<\/li>\n<li>Use more store slots to coordinate roles between builder bots<\/li>\n<\/ul>\n<p>Notice that you already solved the second one in <a href=\"../turrets-combat/03-the-ammo-gap.md\">Turrets &amp; Combat, step 3<\/a> \u2014 the shipped starter bot doesn't. That's not a coincidence; it's a genuinely open problem, and a reasonable place to start improving on the reference implementation rather than your own bot from these tutorials.<\/p>\n<p>Some concrete next steps, roughly in order of effort:<\/p>\n<ul>\n<li>Read the full <a href=\"../../api-reference/robot-api.md\">Controller API Reference<\/a> \u2014 plenty of methods (<code>get_attackable_tiles<\/code>, <code>launch<\/code>, <code>can_fire_from<\/code>, ...) weren't covered here.<\/li>\n<li>Fix the &quot;independent bots collide&quot; problem from the previous step \u2014 use Store slots to assign roles (harvester vs. router vs. defender) instead of letting every Builder Bot run the same logic.<\/li>\n<li>Add real pathfinding \u2014 the two-axis walk from the logistics tutorial gets stuck on anything more complex than a simple wall.<\/li>\n<li>Layer in Sentinels and Launchers \u2014 a Gunner-only defense is predictable and easy to counter.<\/li>\n<\/ul>\n<p>When you're ready to see how your bot holds up:<\/p>\n<pre><code>fcode submit bots/starter\n<\/code><\/pre>\n<p>Your bot gets queued for ladder matches automatically \u2014 check the Matches page to see results, and the Ladder page to see how you rank. Good luck.<\/p>\n"}];
    const article = document.querySelector('#lesson');
    const links = [...document.querySelectorAll('.lesson-link')];
    const aside = document.querySelector('aside');
    let current = 0;
    function show(index, updateHash = true) {
      current = Math.max(0, Math.min(tutorials.length - 1, index));
      article.innerHTML = tutorials[current].body;
      links.forEach((link, i) => link.classList.toggle('active', i === current));
      document.querySelector('#previous').disabled = current === 0;
      document.querySelector('#next').disabled = current === tutorials.length - 1;
      if (updateHash) history.replaceState(null, '', '#' + tutorials[current].id);
      document.title = tutorials[current].title + ' — FCL Tutorials';
      aside.classList.remove('open');
      window.scrollTo(0, 0);
    }
    links.forEach(link => link.addEventListener('click', () => show(Number(link.dataset.index))));
    document.querySelector('#previous').addEventListener('click', () => show(current - 1));
    document.querySelector('#next').addEventListener('click', () => show(current + 1));
    document.querySelector('.menu').addEventListener('click', () => aside.classList.toggle('open'));
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' && current > 0) show(current - 1);
      if (event.key === 'ArrowRight' && current < tutorials.length - 1) show(current + 1);
    });
    const fromHash = tutorials.findIndex(tutorial => tutorial.id === location.hash.slice(1));
    show(fromHash >= 0 ? fromHash : 0, false);
  </script>
