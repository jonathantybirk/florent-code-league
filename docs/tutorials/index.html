    <aside><p class="eyebrow">Offline archive</p><h1 class="brand">Florent Code League</h1><p class="eyebrow">Tutorials</p><section><h2>Movement &amp; Sensing</h2><button class="lesson-link" data-index="0"><span>01</span>Welcome &amp; the `run()` loop</button><button class="lesson-link" data-index="1"><span>02</span>Spawning a Builder Bot</button><button class="lesson-link" data-index="2"><span>03</span>Moving your Builder Bot</button><button class="lesson-link" data-index="3"><span>04</span>Sensing the map</button><button class="lesson-link" data-index="4"><span>05</span>Recap &amp; checkpoint</button></section><section><h2>Harvesting Titanium</h2><button class="lesson-link" data-index="5"><span>01</span>The titanium economy</button><button class="lesson-link" data-index="6"><span>02</span>Finding ore</button><button class="lesson-link" data-index="7"><span>03</span>Building a Harvester</button><button class="lesson-link" data-index="8"><span>04</span>Cost scaling &amp; early expansion</button><button class="lesson-link" data-index="9"><span>05</span>Recap &amp; checkpoint</button></section><section><h2>Conveyors &amp; Logistics</h2><button class="lesson-link" data-index="10"><span>01</span>Why routing matters</button><button class="lesson-link" data-index="11"><span>02</span>Building a conveyor chain</button><button class="lesson-link" data-index="12"><span>03</span>The last mile</button><button class="lesson-link" data-index="13"><span>04</span>Splitting the flow</button><button class="lesson-link" data-index="14"><span>05</span>Recap &amp; checkpoint</button></section><section><h2>Turrets &amp; Combat</h2><button class="lesson-link" data-index="15"><span>01</span>Meet the turrets</button><button class="lesson-link" data-index="16"><span>02</span>Building a Gunner</button><button class="lesson-link" data-index="17"><span>03</span>The ammo gap</button><button class="lesson-link" data-index="18"><span>04</span>Healing and sabotage</button><button class="lesson-link" data-index="19"><span>05</span>Recap &amp; checkpoint</button></section><section><h2>Comms &amp; Strategy</h2><button class="lesson-link" data-index="20"><span>01</span>The Global Communication Store</button><button class="lesson-link" data-index="21"><span>02</span>Coordinating roles</button><button class="lesson-link" data-index="22"><span>03</span>Putting it all together</button><button class="lesson-link" data-index="23"><span>04</span>Where to go from here</button></section></aside>

  <script>
    const tutorials = [{"id": "movement-sensing/01-welcome", "chapter": "Movement & Sensing", "title": "Your First Bot: Movement & Sensing \u00b7 Step 1 of 5", "name": "Welcome & the `run()` loop", "body": "<h1>Your First Bot: Movement &amp; Sensing \u00b7 Step 1 of 5<\/h1>\n<h2>Welcome &amp; the <code>run()<\/code> loop<\/h2>\n<p>Every bot in Florent Code League is a single Python class: <code>Player<\/code>. The engine creates one <code>Player<\/code> instance per unit on your team, and calls its <code>run()<\/code> method once per round for that unit. Whatever <code>run()<\/code> does \u2014 or doesn't do \u2014 is that unit's entire turn.<\/p>\n<pre><code class=\"language-python\">from fcode import Controller, EntityType\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            pass\n<\/code><\/pre>\n<p>The <code>ct<\/code> argument (short for &quot;controller&quot;) is your only way to interact with the game \u2014 move, build, sense the map, read resources, all of it goes through <code>ct<\/code>. Since a Core, a Builder Bot, and a Gunner all share the same <code>run()<\/code> method, the first thing every bot does is check <code>ct.get_entity_type()<\/code> and branch based on what kind of unit is currently running. Right now we only handle <code>EntityType.CORE<\/code>, and it does nothing (<code>pass<\/code>) \u2014 this is the smallest bot that's valid Python and won't crash.<\/p>\n<h2>Try it<\/h2>\n<p>If you haven't already, install the CLI and scaffold a project:<\/p>\n<pre><code>pip install fcode\nfcode login\nfcode starter\n<\/code><\/pre>\n<p>Copy the code above into <code>bots/starter/main.py<\/code>, replacing its contents, then run a mirror match and watch the replay:<\/p>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: two idle Cores sitting on the map for all 1000 rounds. Nothing moves \u2014 that's expected, we haven't told anything to happen yet. The match will end in a coin-flip tiebreak, since neither side does anything.<\/p>\n<p>Next: give the Core something to do \u2014 spawn a Builder Bot.<\/p>\n"}, {"id": "movement-sensing/02-spawning", "chapter": "Movement & Sensing", "title": "Your First Bot: Movement & Sensing \u00b7 Step 2 of 5", "name": "Spawning a Builder Bot", "body": "<h1>Your First Bot: Movement &amp; Sensing \u00b7 Step 2 of 5<\/h1>\n<h2>Spawning a Builder Bot<\/h2>\n<p>The Core is stationary \u2014 it can't move or attack. Its one job is spawning Builder Bots, your mobile workforce. Spawning costs titanium and only works on a tile within the Core's spawn range.<\/p>\n<pre><code class=\"language-python\">from fcode import Controller, EntityType\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n<\/code><\/pre>\n<p><code>ct.get_nearby_tiles(dist_sq=2)<\/code> returns every tile within squared-distance 2 of the Core \u2014 that's exactly the Core's spawn range: the ring of tiles orthogonally or diagonally adjacent to its 2\u00d72 footprint. We loop over those candidate tiles, and for each one ask <code>ct.can_spawn(pos)<\/code>: is it empty, in range, and can we afford a Builder Bot right now? The first tile that passes gets <code>ct.spawn_builder(pos)<\/code>, and we <code>break<\/code> so we only spawn one bot per round.<\/p>\n<p>Almost every build action in the game follows this same <code>can_X()<\/code> / <code>X()<\/code> pairing \u2014 check first, then act. The <code>can_*<\/code> checks never raise; the action methods (<code>spawn_builder<\/code>, <code>move<\/code>, <code>build_harvester<\/code>, ...) raise a <code>GameError<\/code> if you call them somewhere illegal, so checking first keeps your bot from crashing mid-match.<\/p>\n<h2>Try it<\/h2>\n<p>Replace <code>bots/starter/main.py<\/code> with the code above, then:<\/p>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: a Builder Bot appears next to each Core in round 1 and just sits there (we haven't given it a <code>run()<\/code> branch yet, so it does nothing). The unit count in the match summary should read 1 or more per side.<\/p>\n<p>Next: make that Builder Bot actually move.<\/p>\n"}, {"id": "movement-sensing/03-moving", "chapter": "Movement & Sensing", "title": "Your First Bot: Movement & Sensing \u00b7 Step 3 of 5", "name": "Moving your Builder Bot", "body": "<h1>Your First Bot: Movement &amp; Sensing \u00b7 Step 3 of 5<\/h1>\n<h2>Moving your Builder Bot<\/h2>\n<p>Builder Bots are the only unit that can move, and they move only in the four cardinal directions \u2014 <code>Direction.NORTH<\/code>, <code>Direction.SOUTH<\/code>, <code>Direction.EAST<\/code>, <code>Direction.WEST<\/code>. (The <code>Direction<\/code> enum still lists all 8 compass points plus <code>Direction.CENTRE<\/code>, but diagonals aren't legal moves: <code>ct.move()<\/code> with a diagonal raises a <code>GameError<\/code>, and <code>ct.can_move()<\/code> returns <code>False<\/code>. Diagonals stay valid elsewhere, e.g. turret facing.) Movement follows the same check-then-act pattern as spawning.<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, EntityType\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n        elif etype == EntityType.BUILDER_BOT:\n            direction = random.choice(CARDINALS)\n            if ct.can_move(direction):\n                ct.move(direction)\n<\/code><\/pre>\n<p><code>CARDINALS<\/code> is the four legal move directions \u2014 a handy constant you'll reuse throughout these tutorials. Each round, our Builder Bot picks a random cardinal direction and moves there if <code>ct.can_move()<\/code> says it's legal (not a wall, not occupied, and not a diagonal). Movement puts the unit on a 1-round cooldown, so a bot can only move once every round at most \u2014 no double-stepping.<\/p>\n<p>Once you start building/attacking/healing in later tutorials, <code>ct.can_move()<\/code> can also return <code>False<\/code> for a different reason: acting and moving are mutually exclusive per round for Builder Bots. If a move you expected to be legal is rejected, check <code>ct.get_action_cooldown()<\/code> \u2014 if it's nonzero, you're act-locked from a previous action this round, not blocked by terrain or another unit.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page says to check <code>ct.can_act()<\/code> here. <strong>This method does not exist<\/strong> in the installed <code>fcode<\/code> engine (confirmed by direct call at runtime \u2014 raises <code>AttributeError<\/code>). Use <code>ct.get_action_cooldown() == 0<\/code> instead, as corrected above.<\/p>\n<\/blockquote>\n<p>This is a genuinely bad movement strategy \u2014 the bot has no memory and no goal, so it'll wander in place as often as it makes progress. That's fine for now; the point is confirming movement works before we add any intelligence.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: the Builder Bot visibly wanders around the map instead of standing still. Scrub through the replay \u2014 you should see it occasionally get stuck against a wall (that round it just won't move, since <code>can_move<\/code> returned <code>False<\/code> in the direction it picked).<\/p>\n<p>Next: use what the bot can see to move somewhere purposeful, instead of randomly.<\/p>\n"}, {"id": "movement-sensing/04-sensing", "chapter": "Movement & Sensing", "title": "Your First Bot: Movement & Sensing \u00b7 Step 4 of 5", "name": "Sensing the map", "body": "<h1>Your First Bot: Movement &amp; Sensing \u00b7 Step 4 of 5<\/h1>\n<h2>Sensing the map<\/h2>\n<p>Every unit has a vision radius, and <code>ct.get_nearby_tiles()<\/code> returns the tiles inside it. For each tile you can ask <code>ct.get_tile_env(pos)<\/code>, which returns one of three <code>Environment<\/code> values: <code>EMPTY<\/code> (plain traversable ground), <code>WALL<\/code> (impassable), or <code>ORE_TITANIUM<\/code> (an ore deposit \u2014 also traversable, and buildable on, which matters starting next tutorial).<\/p>\n<p>We'll use that to steer away from walls instead of bumping into them at random, and introduce two debugging tools along the way: <code>print()<\/code> (captured per-round and shown in the visualiser) and <code>ct.draw_indicator_dot()<\/code> (draws a coloured dot on the map, saved into the replay).<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType\n\n# Builder bots move only in the four cardinal directions.\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        ct.draw_indicator_dot(pos, 0, 255, 0)\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            direction = random.choice(move_options)\n            ct.move(direction)\n            print(f&quot;round {ct.get_current_round()}: moved {direction.name} to {ct.get_position()}&quot;)\n<\/code><\/pre>\n<p>We moved the Builder Bot's logic into its own <code>_run_builder<\/code> method to keep <code>run()<\/code> readable \u2014 a pattern you'll want as your bot grows. <code>pos.add(direction)<\/code> returns the position one step in that direction without actually moving, which lets us peek at a tile's environment before committing. We build a list of directions that are both legal (<code>can_move<\/code>) and lead to plain ground (<code>Environment.EMPTY<\/code>), preferring those; if none qualify (e.g. surrounded by ore or a dead end) we fall back to any legal move so the bot never just stops.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: a green dot following the Builder Bot every round, and if your visualiser build supports it, a per-round log line in the replay's debug output showing the direction it chose. The bot should look slightly less erratic than in the previous step, since it's now actively avoiding walking in place against obstacles.<\/p>\n<p>Next: recap, and a look at what's coming.<\/p>\n"}, {"id": "movement-sensing/05-recap", "chapter": "Movement & Sensing", "title": "Your First Bot: Movement & Sensing \u00b7 Step 5 of 5", "name": "Recap & checkpoint", "body": "<h1>Your First Bot: Movement &amp; Sensing \u00b7 Step 5 of 5<\/h1>\n<h2>Recap &amp; checkpoint<\/h2>\n<p>You now have a bot that:<\/p>\n<ul>\n<li>Dispatches on <code>ct.get_entity_type()<\/code> to handle each unit type separately<\/li>\n<li>Spawns a Builder Bot from the Core within its spawn range (<code>ct.get_nearby_tiles(dist_sq=2)<\/code>, <code>ct.can_spawn<\/code>, <code>ct.spawn_builder<\/code>)<\/li>\n<li>Moves that Builder Bot around with <code>Direction<\/code>, <code>ct.can_move<\/code>, <code>ct.move<\/code><\/li>\n<li>Reads the map with <code>ct.get_tile_env()<\/code> to avoid walls and prefer open ground<\/li>\n<li>Debugs itself with <code>print()<\/code> and <code>ct.draw_indicator_dot()<\/code><\/li>\n<\/ul>\n<p>Every mechanic here \u2014 the <code>run()<\/code> dispatch pattern, the <code>can_X()<\/code> / <code>X()<\/code> check-then-act convention, and vision-based sensing \u2014 is used identically everywhere else in the game. Turrets, harvesters, and conveyors all build on exactly this foundation.<\/p>\n<p>The bot from step 4 is your starting point for the next tutorial. Keep it around \u2014 you'll extend <code>_run_builder<\/code> rather than starting from scratch.<\/p>\n<p>Next up: <a href=\"../harvesting-titanium/01-the-titanium-economy.md\">Harvesting Titanium<\/a> \u2014 put that wandering Builder Bot to work mining ore and growing your economy.<\/p>\n"}, {"id": "harvesting-titanium/01-the-titanium-economy", "chapter": "Harvesting Titanium", "title": "Harvesting Titanium \u00b7 Step 1 of 5", "name": "The titanium economy", "body": "<h1>Harvesting Titanium \u00b7 Step 1 of 5<\/h1>\n<h2>The titanium economy<\/h2>\n<p>Titanium is the only resource in Florent Code League. It's a single shared balance per team \u2014 every build and spawn action draws from the same pool, and every unit can read it with <code>ct.get_global_resources()<\/code>.<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        titanium = ct.get_global_resources()\n        if ct.get_current_round() % 50 == 0:\n            print(f&quot;round {ct.get_current_round()}: {titanium} titanium&quot;)\n\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n<\/code><\/pre>\n<p>This is your Tutorial 1 bot, unchanged apart from the Core printing its balance every 50 rounds. <code>ct.get_global_resources()<\/code> returns a plain <code>int<\/code> \u2014 your team's current titanium balance. Every cost-related method in the API returns the same kind of plain <code>int<\/code>; you'll see one in a moment.<\/p>\n<p>Every team also gets passive income: 10 titanium every 4 rounds, regardless of anything you build. It's small, but it means titanium always ticks upward even if your economy does nothing \u2014 which is exactly what you'll see in this step, since we haven't built a Harvester yet.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: the printed balance climbing slowly and steadily \u2014 roughly +10 every 4 rounds, minus whatever the Core is spending to spawn Builder Bots. That slow climb is pure passive income.<\/p>\n<p>Next: find some ore.<\/p>\n"}, {"id": "harvesting-titanium/02-finding-ore", "chapter": "Harvesting Titanium", "title": "Harvesting Titanium \u00b7 Step 2 of 5", "name": "Finding ore", "body": "<h1>Harvesting Titanium \u00b7 Step 2 of 5<\/h1>\n<h2>Finding ore<\/h2>\n<p>Ore tiles show up as <code>Environment.ORE_TITANIUM<\/code> when you sense them \u2014 the same <code>ct.get_tile_env()<\/code> call from Tutorial 1, just checking for a different value. Let's make the Builder Bot beeline for the nearest one it can see, instead of wandering randomly once ore is in view.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page uses <code>pos.cardinal_direction_to(target)<\/code> below. <strong>This method does not exist<\/strong> in the installed <code>fcode<\/code> engine (confirmed by direct call at runtime \u2014 raises <code>AttributeError<\/code>). The code below uses <code>pos.direction_to(target)<\/code> instead, falling back to a rotated direction if it comes back diagonal.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n\n        ore_tiles = [\n            t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM\n        ]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n            desired = pos.direction_to(target)\n            for direction in (desired, desired.rotate_left(), desired.rotate_right()):\n                if ct.can_move(direction):\n                    ct.move(direction)\n                    return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n<\/code><\/pre>\n<p>Two <code>Position<\/code> helpers do the heavy lifting: <code>pos.distance_squared(other)<\/code> picks the closest ore tile out of everything currently visible, and <code>pos.direction_to(other)<\/code> converts &quot;I want to go there&quot; into a direction \u2014 the nearest of all 8 compass points, so it may come back diagonal. Since Builder Bots can only move on the 4 cardinal directions, we try the ideal direction first and fall back to a 45\u00b0-rotated one (<code>rotate_left()<\/code>/<code>rotate_right()<\/code>) if it's diagonal or blocked. If no ore is visible yet, we fall back to the same explore-and-avoid-walls logic from Tutorial 1.<\/p>\n<p>This is a &quot;greedy nearest&quot; strategy \u2014 it only considers ore it can currently see, and re-evaluates every round, so a bot can flip-flop between two similarly-distant ore patches as it moves. That's fine for now.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: once a Builder Bot's vision touches an ore tile, it should turn and beeline toward it instead of continuing to wander.<\/p>\n<p>Next: actually build a Harvester there.<\/p>\n"}, {"id": "harvesting-titanium/03-building-a-harvester", "chapter": "Harvesting Titanium", "title": "Harvesting Titanium \u00b7 Step 3 of 5", "name": "Building a Harvester", "body": "<h1>Harvesting Titanium \u00b7 Step 3 of 5<\/h1>\n<h2>Building a Harvester<\/h2>\n<p>Once a Builder Bot is orthogonally adjacent to an ore tile \u2014 NORTH, SOUTH, EAST, or WEST of its position, never diagonal and never its own tile \u2014 it can build a Harvester there with <code>ct.build_harvester(pos)<\/code>.<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n\n        for d in CARDINALS:\n            tile = pos.add(d)\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                return\n\n        ore_tiles = [\n            t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM\n        ]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n            direction = pos.direction_to(target)\n            if ct.can_move(direction):\n                ct.move(direction)\n                return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n<\/code><\/pre>\n<p>We check the four orthogonally adjacent tiles first \u2014 if one is ore and buildable, build immediately and stop for this round. Otherwise we fall through to the same seek-and-explore logic as before.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>Watch the match summary line at the end of <code>fcode run<\/code> \u2014 it prints something like:<\/p>\n<pre><code>Titanium     136 (0 mined)    147 (0 mined)\n<\/code><\/pre>\n<p>That &quot;0 mined&quot; is not a bug \u2014 it's the whole point of this step. Your Harvester is built and ready to output a stack every 4 rounds, but that titanium has nowhere to go. A Harvester only feeds the tiles directly next to it, and unless one of those tiles happens to be your Core, it just sits idle \u2014 output ready, going nowhere, not actually wasting anything. Nothing in your printed balance will move because of it.<\/p>\n<p>This is by design: harvesting and delivering are two separate problems. Solving delivery \u2014 routing a Harvester's output back to your Core \u2014 is the entire subject of the next tutorial.<\/p>\n<p>Next: Conveyors, and the cost of not planning your economy layout.<\/p>\n"}, {"id": "harvesting-titanium/04-cost-scaling", "chapter": "Harvesting Titanium", "title": "Harvesting Titanium \u00b7 Step 4 of 5", "name": "Cost scaling & early expansion", "body": "<h1>Harvesting Titanium \u00b7 Step 4 of 5<\/h1>\n<h2>Cost scaling &amp; early expansion<\/h2>\n<p>Every build cost scales up as your team builds more entities \u2014 not simply because rounds are passing. The scale factor starts at 100% and increases additively each time something is built (and decreases again if it's destroyed); it never moves on its own between builds. <code>ct.get_scale_percent()<\/code> returns the current factor, and every <code>ct.get_*_cost()<\/code> method already bakes it in, so you never have to do the multiplication yourself.<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        if ct.get_current_round() % 50 == 0:\n            scale = ct.get_scale_percent()\n            harvester_cost = ct.get_harvester_cost()\n            print(f&quot;round {ct.get_current_round()}: scale {scale:.0f}%, harvester costs {harvester_cost} Ti&quot;)\n\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n\n        for tile in ct.get_nearby_tiles(dist_sq=2):\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                return\n\n        ore_tiles = [\n            t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM\n        ]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n            direction = pos.direction_to(target)\n            if ct.can_move(direction):\n                ct.move(direction)\n                return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n<\/code><\/pre>\n<p>Watch the printed cost climb over the match. It isn't climbing because rounds are passing \u2014 it's climbing because the Core is still spawning a new Builder Bot every round it can afford one (that loop was there since Tutorial 1), and each spawned bot nudges your team's scale factor up. If the Core ever ran out of titanium and stopped spawning, the printed cost would stop climbing too, no matter how many more rounds went by. As costs rise, the Core will naturally spawn less often once titanium gets tight, without any extra code from us.<\/p>\n<p>The strategic implication: cost scaling isn't a clock ticking against you \u2014 it's a running tally of what your own team has already built. Everything you build makes the next thing you build a little more expensive, so it pays to sequence builds deliberately (cheapest, highest-leverage things first) rather than to rush for its own sake. A bot that spends its first hundred rounds scouting and building nothing pays no scale tax at all when it finally starts building.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: the printed cost line climbing as the Core keeps spawning Builder Bots \u2014 a Harvester that costs 20 Ti before anything is built should cost noticeably more by round 500, purely because of everything spawned in between.<\/p>\n<p>Next: recap, and why this tutorial ends with a bot that still can't grow its economy.<\/p>\n"}, {"id": "harvesting-titanium/05-recap", "chapter": "Harvesting Titanium", "title": "Harvesting Titanium \u00b7 Step 5 of 5", "name": "Recap & checkpoint", "body": "<h1>Harvesting Titanium \u00b7 Step 5 of 5<\/h1>\n<h2>Recap &amp; checkpoint<\/h2>\n<p>You now have a bot that:<\/p>\n<ul>\n<li>Reads the team's shared titanium balance with <code>ct.get_global_resources()<\/code><\/li>\n<li>Seeks out visible ore using <code>Environment.ORE_TITANIUM<\/code>, <code>pos.distance_squared()<\/code>, and <code>pos.direction_to()<\/code><\/li>\n<li>Builds a Harvester on an orthogonally adjacent ore tile with <code>ct.can_build_harvester<\/code> / <code>ct.build_harvester<\/code><\/li>\n<li>Reads scaling costs with <code>ct.get_scale_percent()<\/code> and <code>ct.get_*_cost()<\/code><\/li>\n<\/ul>\n<p>But it still ends this tutorial with zero mined titanium reaching its balance, no matter how many Harvesters it builds. That's not a loose end we forgot \u2014 a Harvester's income is physically stranded unless something routes it to a sink. That &quot;something&quot; is a Conveyor.<\/p>\n<p>Next up: <a href=\"../conveyors-logistics/01-why-routing-matters.md\">Logistics: Conveyors &amp; Splitters<\/a> \u2014 finally get that titanium moving.<\/p>\n"}, {"id": "conveyors-logistics/01-why-routing-matters", "chapter": "Conveyors & Logistics", "title": "Logistics: Conveyors & Splitters \u00b7 Step 1 of 5", "name": "Why routing matters", "body": "<h1>Logistics: Conveyors &amp; Splitters \u00b7 Step 1 of 5<\/h1>\n<h2>Why routing matters<\/h2>\n<p>Tutorial 2 ended with a real Harvester that never grew your balance. Here's why: a Harvester's output only reaches the 4 tiles directly next to it (north, east, south, west). If none of those tiles can accept a stack \u2014 and on a real map, none usually can until you build something there \u2014 the Harvester just sits idle, output ready but going nowhere. It isn't wasting titanium each round; it simply won't produce the next stack until something is there to receive the current one.<\/p>\n<p>Conveyors solve this by relaying resources one tile per round, in a single direction chosen when you build them. Chain enough of them together and you can move titanium from anywhere on the map back to base.<\/p>\n<p>One API detail matters a lot here: conveyors (and Splitters, later in this tutorial) can only face the 4 cardinal directions \u2014 NORTH, EAST, SOUTH, WEST \u2014 never a diagonal. That's the same <code>CARDINALS<\/code> list you've been moving with since Tutorial 1, doing double duty for building facings:<\/p>\n<pre><code class=\"language-python\">CARDINALS = [Direction.NORTH, Direction.EAST, Direction.SOUTH, Direction.WEST]\n<\/code><\/pre>\n<p>You'll also need to know exactly where your Core is, in a form that's more precise than &quot;wherever I spawned.&quot; Every Builder Bot can find it by scanning its surroundings for a building whose type is <code>EntityType.CORE<\/code>:<\/p>\n<pre><code class=\"language-python\">core_tile = None\nfor tile in ct.get_nearby_tiles():\n    bid = ct.get_tile_building_id(tile)\n    if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n        core_tile = tile\n        break\n<\/code><\/pre>\n<p>At round 1 the Core is the only building on the map, so the first builder-owned tile this finds is guaranteed to be part of the Core's footprint. Cache the result once \u2014 the Core never moves \u2014 the same way you'd cache anything expensive to recompute.<\/p>\n<p>Next: put a chain together and watch what happens when you don't quite get the routing right.<\/p>\n"}, {"id": "conveyors-logistics/02-building-a-conveyor-chain", "chapter": "Conveyors & Logistics", "title": "Logistics: Conveyors & Splitters \u00b7 Step 2 of 5", "name": "Building a conveyor chain", "body": "<h1>Logistics: Conveyors &amp; Splitters \u00b7 Step 2 of 5<\/h1>\n<h2>Building a conveyor chain<\/h2>\n<p>Let's build a first version: find ore, build a Harvester on it, then walk back toward the Core one tile at a time, laying a conveyor at each tile that points toward the next one.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page uses <code>pos.cardinal_direction_to(target)<\/code> in <code>_seek_and_harvest<\/code> below. <strong>This method does not exist<\/strong> in the installed <code>fcode<\/code> engine (confirmed by direct call at runtime \u2014 raises <code>AttributeError<\/code>). The code below uses <code>pos.direction_to(target)<\/code> with a rotate-left/right fallback instead.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\n# Builder bots move only in the four cardinal directions.\nCARDINALS = [Direction.NORTH, Direction.EAST, Direction.SOUTH, Direction.WEST]\n\ndef in_bounds(ct: Controller, pos: Position) -&gt; bool:\n    return 0 &lt;= pos.x &lt; ct.get_map_width() and 0 &lt;= pos.y &lt; ct.get_map_height()\n\nclass Player:\n    def __init__(self):\n        self.core_tile: Position | None = None\n        self.harvester_pos: Position | None = None\n        self.chain_done = False\n\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        if self.core_tile is None:\n            for tile in ct.get_nearby_tiles():\n                bid = ct.get_tile_building_id(tile)\n                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    self.core_tile = tile\n                    break\n\n        if self.harvester_pos is None:\n            self._seek_and_harvest(ct, pos)\n        elif not self.chain_done and self.core_tile is not None:\n            self._lay_conveyor_toward_core(ct, pos)\n\n    def _seek_and_harvest(self, ct: Controller, pos: Position) -&gt; None:\n        # Only cardinal ore tiles: a Harvester's output only reaches its 4\n        # cardinal neighbours, so our chain has to start on one of those exactly.\n        for d in CARDINALS:\n            tile = pos.add(d)\n            if not in_bounds(ct, tile):\n                continue\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                self.harvester_pos = tile\n                return\n\n        ore_tiles = [t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n            desired = pos.direction_to(target)\n            for direction in (desired, desired.rotate_left(), desired.rotate_right()):\n                if ct.can_move(direction):\n                    ct.move(direction)\n                    return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _pick_direction(self, ct: Controller, pos: Position) -&gt; Direction | None:\n        assert self.core_tile is not None\n        dx = self.core_tile.x - pos.x\n        dy = self.core_tile.y - pos.y\n        if dx != 0:\n            d = Direction.EAST if dx &gt; 0 else Direction.WEST\n            if ct.can_move(d):\n                return d\n        if dy != 0:\n            d = Direction.SOUTH if dy &gt; 0 else Direction.NORTH\n            if ct.can_move(d):\n                return d\n        return None\n\n    def _lay_conveyor_toward_core(self, ct: Controller, pos: Position) -&gt; None:\n        direction = self._pick_direction(ct, pos)\n        if direction is None:\n            self.chain_done = True\n            return\n\n        # Builder bots can only build on an orthogonally adjacent tile,\n        # never their own -- so the conveyor goes on the tile we're about\n        # to step onto, not the one we're standing on.\n        next_pos = pos.add(direction)\n        neighbor = next_pos.add(direction)\n        facing_core = False\n        if in_bounds(ct, neighbor):\n            bid = ct.get_tile_building_id(neighbor)\n            facing_core = bid is not None and ct.get_entity_type(bid) == EntityType.CORE\n\n        if ct.can_build_conveyor(next_pos, direction):\n            ct.build_conveyor(next_pos, direction)\n\n        if facing_core:\n            self.chain_done = True\n            return\n\n        # A successful build already used this round's action, which now\n        # also blocks this round's move -- so this simply does nothing\n        # until next round, when the conveyor is already there (the build\n        # above becomes a no-op) and the move goes through instead.\n        if ct.can_move(direction):\n            ct.move(direction)\n<\/code><\/pre>\n<p><code>_pick_direction<\/code> closes the horizontal gap to the Core first, then the vertical one \u2014 a simple L-shaped route that's enough to get around a lot of terrain without real pathfinding. Builder Bots can only ever build on a tile orthogonally adjacent to themselves, never their own \u2014 so <code>_lay_conveyor_toward_core<\/code> builds the conveyor one tile ahead, on the tile it's about to step onto, facing the same direction it's about to walk (and, same as before, checks whether that conveyor's own output faces straight into the Core, in which case we're done). Building and moving now share the same round's budget too: a successful build uses up the round's action and blocks that round's move, so the <code>ct.can_move(direction)<\/code> check right after it will simply come back <code>False<\/code> the round a build just happened \u2014 the bot just waits. Next round, the conveyor is already there, so the build is skipped (<code>can_build_conveyor<\/code> now returns <code>False<\/code>) and the guarded move goes through instead. No extra state needed to track any of this \u2014 it falls out of the same two checks, one round later.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: check the match summary for a mined figure next to titanium. Run it a few times, maybe with <code>fcode run starter starter --seed 2<\/code> and a couple of other seed numbers \u2014 you'll likely notice this chain works some of the time and silently fails the rest. When it fails, don't expect a clean gap in the chain: look closely near the Core in the replay and you may instead find one extra conveyor sitting at the very end, built the round before the bot gave up, facing whichever way it happened to be walking rather than the Core. Either way, no error, no crash, nothing in the logs \u2014 titanium just stops arriving. That's a real, reproducible bug in the code above \u2014 not a fluke of the RNG. Let's go find it.<\/p>\n"}, {"id": "conveyors-logistics/03-the-last-mile", "chapter": "Conveyors & Logistics", "title": "Logistics: Conveyors & Splitters \u00b7 Step 3 of 5", "name": "The last mile", "body": "<h1>Logistics: Conveyors &amp; Splitters \u00b7 Step 3 of 5<\/h1>\n<h2>The last mile<\/h2>\n<p>Here's the bug from the previous step: <code>_pick_direction<\/code> only returns a direction when <code>ct.can_move(d)<\/code> is <code>True<\/code>. The Core's footprint is never bot-passable \u2014 not even to its own team \u2014 so <code>can_move<\/code> reliably returns <code>False<\/code> the moment a neighbouring tile belongs to the Core. That looks like a free &quot;have I arrived?&quot; signal, except the Core is 2\u00d72: approach it diagonally and both candidate directions can be blocked by two different footprint tiles, so <code>_pick_direction<\/code> gives up (<code>None<\/code>) without ever checking whether what's blocking it is actually the Core. <code>False<\/code> from <code>can_move<\/code> just means &quot;something's there&quot; \u2014 a Core tile, a wall, another bot \u2014 it can't tell you which. The reliable fix is simpler: stop trying to infer &quot;have I arrived?&quot; from whether you can move forward, and just check who's standing next to you.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> <code>_seek_and_harvest<\/code> still uses <code>pos.cardinal_direction_to(target)<\/code> on the published page \u2014 <strong>this method does not exist<\/strong> in the installed <code>fcode<\/code> engine (confirmed by direct call, raises <code>AttributeError<\/code>). Corrected below to <code>pos.direction_to(target)<\/code> with a rotate-left/right fallback, same as the previous tutorial.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\n# Builder bots move only in the four cardinal directions.\nCARDINALS = [Direction.NORTH, Direction.EAST, Direction.SOUTH, Direction.WEST]\n\ndef in_bounds(ct: Controller, pos: Position) -&gt; bool:\n    return 0 &lt;= pos.x &lt; ct.get_map_width() and 0 &lt;= pos.y &lt; ct.get_map_height()\n\nclass Player:\n    def __init__(self):\n        self.core_tile: Position | None = None\n        self.harvester_pos: Position | None = None\n        self.chain_done = False\n\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            self._run_core(ct)\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_core(self, ct: Controller) -&gt; None:\n        for pos in ct.get_nearby_tiles(dist_sq=2):\n            if ct.can_spawn(pos):\n                ct.spawn_builder(pos)\n                break\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        if self.core_tile is None:\n            for tile in ct.get_nearby_tiles():\n                bid = ct.get_tile_building_id(tile)\n                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    self.core_tile = tile\n                    break\n\n        if self.harvester_pos is None:\n            self._seek_and_harvest(ct, pos)\n        elif not self.chain_done and self.core_tile is not None:\n            self._lay_conveyor_toward_core(ct, pos)\n\n    def _seek_and_harvest(self, ct: Controller, pos: Position) -&gt; None:\n        for d in CARDINALS:\n            tile = pos.add(d)\n            if not in_bounds(ct, tile):\n                continue\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                self.harvester_pos = tile\n                return\n\n        ore_tiles = [t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n            desired = pos.direction_to(target)\n            for direction in (desired, desired.rotate_left(), desired.rotate_right()):\n                if ct.can_move(direction):\n                    ct.move(direction)\n                    return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _pick_direction(self, ct: Controller, pos: Position) -&gt; Direction | None:\n        assert self.core_tile is not None\n        dx = self.core_tile.x - pos.x\n        dy = self.core_tile.y - pos.y\n        if dx != 0:\n            d = Direction.EAST if dx &gt; 0 else Direction.WEST\n            if ct.can_move(d):\n                return d\n        if dy != 0:\n            d = Direction.SOUTH if dy &gt; 0 else Direction.NORTH\n            if ct.can_move(d):\n                return d\n        return None\n\n    def _lay_conveyor_toward_core(self, ct: Controller, pos: Position) -&gt; None:\n        # Check every tile we could build on for the Core BEFORE calling\n        # _pick_direction, independent of movement. Builder bots can only\n        # build on an orthogonally adjacent tile now, never their own -- so\n        # the final relay conveyor always has to go one tile AHEAD of us,\n        # and we have to find that tile by checking who's standing next to\n        # each of our neighbours, not by asking whether we can step toward\n        # the Core (can_move() fails the same way next to a wall or another\n        # bot).\n        for d in CARDINALS:\n            next_pos = pos.add(d)\n            if not in_bounds(ct, next_pos):\n                continue\n            for d2 in CARDINALS:\n                neighbor = next_pos.add(d2)\n                if not in_bounds(ct, neighbor):\n                    continue\n                bid = ct.get_tile_building_id(neighbor)\n                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    if ct.can_build_conveyor(next_pos, d2):\n                        ct.build_conveyor(next_pos, d2)\n                    self.chain_done = True\n                    return\n\n        direction = self._pick_direction(ct, pos)\n        if direction is None:\n            self.chain_done = True\n            return\n\n        next_pos = pos.add(direction)\n        if ct.can_build_conveyor(next_pos, direction):\n            ct.build_conveyor(next_pos, direction)\n        if ct.can_move(direction):\n            ct.move(direction)\n<\/code><\/pre>\n<p><code>_lay_conveyor_toward_core<\/code> now checks every tile it could build on for a Core-type building first, independent of <code>_pick_direction<\/code> \u2014 one tile further out than before, since the final relay conveyor can no longer be built by standing on it; it has to be placed from one tile back, exactly like every other segment in the chain. If a candidate tile touches the Core, we build the final conveyor there facing it and stop \u2014 we never even attempt to walk onto it, since a conveyor doesn't need a bot standing on it to work. Only if no neighbour leads to a Core-adjacent tile do we fall through to <code>_pick_direction<\/code> and advance normally.<\/p>\n<p>The general lesson is worth keeping: when you need to know &quot;has something specific happened,&quot; query for it directly (<code>get_tile_building_id<\/code> + <code>get_entity_type<\/code>) rather than inferring it from a side effect of a different action (<code>can_move<\/code>). A blocked move can mean a dozen different things \u2014 the Core's footprint, a wall, another bot standing there \u2014 and treating all of them as &quot;I've arrived&quot; fails silently: no exception, just a chain that stops one tile short with no explanation.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: noticeably more consistent mined numbers across repeated runs and different seeds \u2014 not perfect (independent Builder Bots can still occasionally block each other's paths, since this is still a fairly naive router), but reliably nonzero on at least one side most of the time.<\/p>\n<p>Next: give a Harvester's output more than one place it can go.<\/p>\n"}, {"id": "conveyors-logistics/04-splitting-the-flow", "chapter": "Conveyors & Logistics", "title": "Logistics: Conveyors & Splitters \u00b7 Step 4 of 5", "name": "Splitting the flow", "body": "<h1>Logistics: Conveyors &amp; Splitters \u00b7 Step 4 of 5<\/h1>\n<h2>Splitting the flow<\/h2>\n<p>A plain Conveyor has exactly one output tile: whatever's directly in front of it. A Splitter takes input from directly behind it and can output to any of the other three cardinal sides \u2014 useful once you want one Harvester's income to reach more than one destination, like your Core and a turret cluster somewhere else. It doesn't split a stack across sides simultaneously: each delivery goes whole (10 Ti) to whichever connected side hasn't been used in the longest time, so with multiple destinations wired up, they take turns receiving stacks rather than all filling up at once.<\/p>\n<p><code>ct.build_splitter(pos, direction)<\/code> uses <code>direction<\/code> the same way <code>build_conveyor<\/code> does: it's the side the flow continues toward. The input side is automatically the opposite direction. So swapping the final segment of our chain from a Conveyor to a Splitter doesn't change how it feeds the Core \u2014 it just opens up two more sides for something else to tap into later.<\/p>\n<pre><code class=\"language-python\">                if bid is not None and ct.get_entity_type(bid) == EntityType.CORE:\n                    if ct.can_build_splitter(next_pos, d2):\n                        ct.build_splitter(next_pos, d2)\n                    self.chain_done = True\n                    return\n<\/code><\/pre>\n<p>That's the only change needed to <code>_lay_conveyor_toward_core<\/code> from the previous step \u2014 everywhere else, <code>ct.build_conveyor(next_pos, direction)<\/code> becomes <code>ct.build_splitter(next_pos, direction)<\/code> and <code>can_build_conveyor<\/code> becomes <code>can_build_splitter<\/code>. Titanium still reaches your Core exactly as before; the difference is invisible until you actually build something on one of the Splitter's other two output sides.<\/p>\n<p>We won't wire up that second output in this tutorial \u2014 a Gunner turret, which is exactly the kind of thing worth feeding from a Splitter, doesn't show up until the next one. Keep the idea in mind: a Splitter at the last junction before your Core is a cheap way to keep your options open, even before you know exactly what else you'll want to feed.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: the same delivery behavior as the previous step \u2014 titanium still reaches your Core through the Splitter exactly as it did through the plain Conveyor.<\/p>\n<p>Next: recap, and what this tutorial sets up for combat.<\/p>\n"}, {"id": "conveyors-logistics/05-recap", "chapter": "Conveyors & Logistics", "title": "Logistics: Conveyors & Splitters \u00b7 Step 5 of 5", "name": "Recap & checkpoint", "body": "<h1>Logistics: Conveyors &amp; Splitters \u00b7 Step 5 of 5<\/h1>\n<h2>Recap &amp; checkpoint<\/h2>\n<p>You now have a bot that:<\/p>\n<ul>\n<li>Locates its own Core precisely, by scanning for a building of type <code>EntityType.CORE<\/code> rather than guessing from spawn position<\/li>\n<li>Builds a cardinal-only conveyor chain from a Harvester back to the Core with <code>ct.can_build_conveyor<\/code> / <code>ct.build_conveyor<\/code><\/li>\n<li>Routes around simple obstacles with a two-axis (horizontal-then-vertical) walk<\/li>\n<li>Detects &quot;have I arrived&quot; by querying tile occupancy directly, instead of relying on <code>can_move<\/code> as a proxy \u2014 and knows why that distinction matters<\/li>\n<li>Understands Splitters as a drop-in upgrade for the last conveyor segment before a destination, opening up extra output sides<\/li>\n<\/ul>\n<p>Titanium should now be visibly flowing from ore to Core \u2014 the &quot;mined&quot; column in your match summary should read nonzero for at least one side most of the time. This bot is still rough: independent Builder Bots can collide with each other's chains, dead ends aren't routed around, and none of this is optimized. That's fine. You have a working economy loop, which is the foundation everything else builds on.<\/p>\n<p>Next up: <a href=\"../turrets-combat/01-meet-the-turrets.md\">Building an Army: Turrets &amp; Combat<\/a> \u2014 put that Splitter's spare output to use feeding a Gunner.<\/p>\n"}, {"id": "turrets-combat/01-meet-the-turrets", "chapter": "Turrets & Combat", "title": "Building an Army: Turrets & Combat \u00b7 Step 1 of 5", "name": "Meet the turrets", "body": "<h1>Building an Army: Turrets &amp; Combat \u00b7 Step 1 of 5<\/h1>\n<h2>Meet the turrets<\/h2>\n<p>Turrets are stationary buildings that attack automatically once built \u2014 no CPU time spent aiming or deciding when to fire. There are three:<\/p>\n<p>| Turret | HP | Cost | Damage | Ammo/shot | Reload |\n|---|---|---|---|---|---|\n| Gunner | 40 | 10 Ti | 10 | 2 | 1 round |\n| Sentinel | 30 | 30 Ti | 18 | 10 | 3 rounds |\n| Launcher | 30 | 20 Ti | \u2014 (repositions a Builder Bot instead) | \u2014 | 1 round |<\/p>\n<p>The Gunner is what you'll build first: cheap, fast-firing, good for holding a corridor. It fires a narrow ray straight ahead in its facing direction \u2014 anything in that line, friend or foe, blocks and can be hit. The Sentinel fires the same single-tile-wide line, but reaches much further and can't be blocked by anything standing in the way \u2014 trading a much higher cost and a 3-round reload for that reach and extra damage per hit; it's a defensive anchor, not something you spam early. The Launcher doesn't deal damage at all \u2014 it picks up a friendly Builder Bot within range and throws it to a target position, which is a repositioning tool, not a weapon.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page says here that &quot;ammunition is a team-wide balance, not something a turret carries \u2014 and it starts at 0,&quot; fixed by having the Core convert titanium into ammunition. <strong>There is no team-wide ammo balance and no Core conversion step<\/strong> in the installed <code>fcode<\/code> engine \u2014 confirmed by enumerating the real <code>Controller<\/code> object at runtime (<code>convert_ammo<\/code>, <code>can_convert_ammo<\/code>, and <code>get_global_ammo<\/code> don't exist; calling any of them raises <code>AttributeError<\/code>). The real mechanic: <strong>each turret holds its own ammo (titanium) locally<\/strong>, and you have to deliver it via Conveyor, same as feeding any other resource-consuming building. A freshly built Gunner won't fire until titanium actually reaches it \u2014 that's still the entire subject of the next two steps, just with a different fix.<\/p>\n<\/blockquote>\n<p>Next: build one and see this for yourself.<\/p>\n"}, {"id": "turrets-combat/02-building-a-gunner", "chapter": "Turrets & Combat", "title": "Building an Army: Turrets & Combat \u00b7 Step 2 of 5", "name": "Building a Gunner", "body": "<h1>Building an Army: Turrets &amp; Combat \u00b7 Step 2 of 5<\/h1>\n<h2>Building a Gunner<\/h2>\n<p><code>ct.build_gunner(pos, direction)<\/code> works exactly like the other builds you already know \u2014 check with <code>can_build_gunner<\/code>, then build, and pick a facing direction for it to watch. Let's set up a small self-contained cluster: a Harvester, and a Gunner right next to it.<\/p>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page has the Gunner check <code>ct.get_global_ammo()<\/code> here. <strong>There is no team-wide ammo balance<\/strong> \u2014 see the correction in <a href=\"01-meet-the-turrets.md\">step 1<\/a>. The code below checks the Gunner's own ammo with <code>ct.get_ammo_amount()<\/code> instead.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\ndef in_bounds(ct: Controller, pos: Position) -&gt; bool:\n    return 0 &lt;= pos.x &lt; ct.get_map_width() and 0 &lt;= pos.y &lt; ct.get_map_height()\n\nclass Player:\n    def __init__(self):\n        self.built = False\n\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n        elif etype == EntityType.GUNNER:\n            self._run_gunner(ct)\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        if self.built:\n            return\n        pos = ct.get_position()\n\n        harvester_pos = pos.add(Direction.NORTH)\n        gunner_pos = pos.add(Direction.SOUTH)\n        if not in_bounds(ct, harvester_pos) or not in_bounds(ct, gunner_pos):\n            self._explore(ct, pos)\n            return\n\n        if ct.get_tile_env(harvester_pos) == Environment.ORE_TITANIUM:\n            if ct.can_build_harvester(harvester_pos):\n                ct.build_harvester(harvester_pos)\n            if ct.can_build_gunner(gunner_pos, Direction.SOUTH):\n                ct.build_gunner(gunner_pos, Direction.SOUTH)\n                self.built = True\n            return\n\n        self._explore(ct, pos)\n\n    def _explore(self, ct: Controller, pos: Position) -&gt; None:\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _run_gunner(self, ct: Controller) -&gt; None:\n        if ct.get_current_round() % 100 == 0:\n            print(f&quot;round {ct.get_current_round()}: ammo = {ct.get_ammo_amount()}&quot;)\n        target = ct.get_gunner_target()\n        if target is not None and ct.can_fire(target):\n            ct.fire(target)\n<\/code><\/pre>\n<p>A Builder Bot that finds ore builds a Harvester one tile north of itself and a Gunner one tile south, facing further south \u2014 income and a guard for it, both within its action radius so no extra movement is needed. The Gunner's own <code>run()<\/code> branch checks <code>ct.get_ammo_amount()<\/code> \u2014 its own locally held ammo \u2014 and tries to fire at whatever <code>ct.get_gunner_target()<\/code> finds in its line of sight.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: every 100 rounds, a printed line reading <code>ammo = 0<\/code> \u2014 for the entire match. The Gunner never fires, no matter what walks in front of it. It's built, it's facing the right way, and it's completely useless: no titanium has ever physically reached it. Notice the Harvester and Gunner here aren't adjacent to each other \u2014 they're both adjacent to the Builder Bot, two tiles apart from each other. This should look familiar: it's the exact same &quot;built but not connected&quot; problem from the Harvester tutorial, just showing up on a turret instead of your Core.<\/p>\n<p>Next: fix that the same way you fixed it there \u2014 with a Conveyor.<\/p>\n"}, {"id": "turrets-combat/03-the-ammo-gap", "chapter": "Turrets & Combat", "title": "Building an Army: Turrets & Combat \u00b7 Step 3 of 5", "name": "The ammo gap", "body": "<h1>Building an Army: Turrets &amp; Combat \u00b7 Step 3 of 5<\/h1>\n<h2>The ammo gap<\/h2>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published page fixes the silent Gunner from the previous step with <code>ct.convert_ammo(amount)<\/code> at the Core, describing ammunition as a team-wide balance filled 1:1 from titanium. <strong>None of that exists<\/strong> in the installed <code>fcode<\/code> engine \u2014 confirmed by enumerating the real <code>Controller<\/code> object at runtime (<code>convert_ammo<\/code>/<code>can_convert_ammo<\/code>/<code>get_global_ammo<\/code> aren't there; calling any of them raises <code>AttributeError<\/code>). Ammo is titanium, held locally by each turret, delivered the same way you'd deliver titanium to anything else: <strong>a Conveyor<\/strong>. The fix below is nowhere near the Core \u2014 it's connecting the Harvester and Gunner from the previous step with a Conveyor, exactly like routing a Harvester's output to your Core in the <a href=\"../conveyors-logistics/01-why-routing-matters.md\">logistics tutorial<\/a>.<\/p>\n<\/blockquote>\n<p>The Harvester and Gunner from step 2 were both adjacent to the Builder Bot, but not to each other \u2014 one tile apart, with the bot standing between them. A Conveyor there, facing from the Harvester's side toward the Gunner's side, closes that gap. The bot has to move off that tile first (Builder Bots can't build on their own tile), then build the Conveyor from next door:<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\ndef in_bounds(ct: Controller, pos: Position) -&gt; bool:\n    return 0 &lt;= pos.x &lt; ct.get_map_width() and 0 &lt;= pos.y &lt; ct.get_map_height()\n\nclass Player:\n    def __init__(self):\n        self.built = False\n        self.gap_pos: Position | None = None\n        self.wired = False\n\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n        elif etype == EntityType.GUNNER:\n            self._run_gunner(ct)\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n\n        if not self.built:\n            harvester_pos = pos.add(Direction.NORTH)\n            gunner_pos = pos.add(Direction.SOUTH)\n            if not in_bounds(ct, harvester_pos) or not in_bounds(ct, gunner_pos):\n                self._explore(ct, pos)\n                return\n\n            if ct.get_tile_env(harvester_pos) == Environment.ORE_TITANIUM:\n                if ct.can_build_harvester(harvester_pos):\n                    ct.build_harvester(harvester_pos)\n                if ct.can_build_gunner(gunner_pos, Direction.SOUTH):\n                    ct.build_gunner(gunner_pos, Direction.SOUTH)\n                    self.built = True\n                    self.gap_pos = pos\n                return\n\n            self._explore(ct, pos)\n            return\n\n        if self.wired:\n            return\n\n        # Step off the gap tile, then build a Conveyor there facing south:\n        # it takes input from the Harvester (its north side) and delivers\n        # straight into the Gunner (its south side).\n        if pos == self.gap_pos:\n            if ct.can_move(Direction.EAST):\n                ct.move(Direction.EAST)\n            return\n\n        if ct.can_build_conveyor(self.gap_pos, Direction.SOUTH):\n            ct.build_conveyor(self.gap_pos, Direction.SOUTH)\n            self.wired = True\n\n    def _explore(self, ct: Controller, pos: Position) -&gt; None:\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _run_gunner(self, ct: Controller) -&gt; None:\n        if ct.get_current_round() % 100 == 0:\n            print(f&quot;round {ct.get_current_round()}: ammo = {ct.get_ammo_amount()}&quot;)\n        target = ct.get_gunner_target()\n        if target is not None and ct.can_fire(target):\n            ct.fire(target)\n<\/code><\/pre>\n<p>Once the Conveyor is in place, the Harvester's next output stack travels one tile onto the Conveyor, then one more tile into the Gunner \u2014 arriving as ammo, ready to spend on its next shot. <code>ct.can_build_conveyor<\/code> / <code>ct.can_move<\/code> gate everything the same way every other check-then-act call in these tutorials has, so nothing here is a new pattern \u2014 just the same delivery problem you've already solved once, applied to a turret instead of a Core.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: the printed ammo line stays at 0 for a while (however long it takes the bot to finish building and the first Harvester stack to travel the two-tile path), then starts climbing as stacks arrive, and dips by 2 each time the Gunner actually fires. In the visualiser, hover the Gunner to see its own held ammo, separate from your team's titanium balance.<\/p>\n<p>Next: give your Builder Bots a way to defend themselves too.<\/p>\n"}, {"id": "turrets-combat/04-healing-and-sabotage", "chapter": "Turrets & Combat", "title": "Building an Army: Turrets & Combat \u00b7 Step 4 of 5", "name": "Healing and sabotage", "body": "<h1>Building an Army: Turrets &amp; Combat \u00b7 Step 4 of 5<\/h1>\n<h2>Healing and sabotage<\/h2>\n<p>Builder Bots have two more combat-adjacent abilities worth knowing, and both are narrower than they might sound at first.<\/p>\n<p><code>ct.heal(pos)<\/code> repairs damaged friendly entities on a tile \u2014 like fire, it's restricted to a tile that's orthogonally adjacent to the Builder Bot (NORTH, SOUTH, EAST, or WEST, never diagonal and never its own tile) \u2014 for 4 HP at a cost of 1 titanium. It heals a building and a Builder Bot standing on it in the same call if both are friendly and damaged. Use <code>ct.can_heal(pos)<\/code> first \u2014 it checks adjacency, cooldown, titanium, and that there's actually damage to repair.<\/p>\n<pre><code class=\"language-python\">for d in (Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST):\n    target = ct.get_position().add(d)  # an adjacent tile, never your own\n    if ct.can_heal(target):\n        ct.heal(target)\n        break\n<\/code><\/pre>\n<p><code>ct.fire(pos)<\/code> is more restrictive than it looks: a Builder Bot can only target a tile that's orthogonally adjacent to it \u2014 NORTH, SOUTH, EAST, or WEST of its current position, never diagonal and never its own tile \u2014 and only damages the building there. It's not a way to attack a nearby enemy unit \u2014 for that, you'd need a turret. What it's actually for is sabotage: walk up next to an enemy's logistics chain (Conveyor and Splitter tiles are walkable, so you could also stand on one and fire at whatever's next to you) and damage a building from the side. Two titanium per hit, same as the cost of the shot itself.<\/p>\n<pre><code class=\"language-python\">for d in (Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST):\n    target = ct.get_position().add(d)  # an adjacent tile, never your own\n    if ct.can_fire(target):\n        ct.fire(target)\n        break\n<\/code><\/pre>\n<p>One more method you'll see referenced elsewhere: <code>ct.self_destruct()<\/code>. Older material (including some in-game documentation) describes it as dealing area damage when you blow up \u2014 that's no longer how it works. Self-destructing a Builder Bot today deals zero damage to anything nearby; it just removes the unit. Its only real use is freeing up your 50-unit cap or retreating a doomed bot before it gets picked off for a bounty \u2014 it is not a weapon.<\/p>\n<h2>Try it<\/h2>\n<p>You don't need a full match to see these work \u2014 try building a Conveyor on a tile adjacent to your Builder Bot, firing at that tile a couple of times to damage it, then healing it back up:<\/p>\n<pre><code class=\"language-python\">if ct.can_fire(pos):\n    ct.fire(pos)\nelif ct.can_heal(pos):\n    ct.heal(pos)\n<\/code><\/pre>\n<p>What you should see: the Conveyor's HP drop by 2 each time you fire, then climb back by 4 each time you heal, in the replay's building-health display.<\/p>\n<p>Next: recap, and putting a full economy-plus-defense bot together.<\/p>\n"}, {"id": "turrets-combat/05-recap", "chapter": "Turrets & Combat", "title": "Building an Army: Turrets & Combat \u00b7 Step 5 of 5", "name": "Recap & checkpoint", "body": "<h1>Building an Army: Turrets &amp; Combat \u00b7 Step 5 of 5<\/h1>\n<h2>Recap &amp; checkpoint<\/h2>\n<p>You now have a bot that:<\/p>\n<ul>\n<li>Knows the three turret types and their tradeoffs \u2014 Gunner (cheap, fast), Sentinel (expensive, hard-hitting), Launcher (repositions, doesn't damage)<\/li>\n<li>Builds a Gunner with <code>ct.build_gunner<\/code> and confirmed it does nothing without ammo actually delivered to it<\/li>\n<li>Feeds a turret's own local ammo stock with a Conveyor from a Harvester, and watched <code>ct.get_ammo_amount()<\/code> fill up and drop as the Gunner fires<\/li>\n<li>Uses <code>ct.heal()<\/code> to repair damaged friendly entities (buildings and Builder Bots alike) on a tile<\/li>\n<li>Understands <code>ct.fire()<\/code>'s real scope for Builder Bots \u2014 sabotaging whatever building you're standing next to, friendly or enemy \u2014 and that <code>self_destruct()<\/code> is a cleanup tool, not a weapon<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Correction vs. the official docs.<\/strong> The published recap credits &quot;converting titanium at the Core (<code>ct.convert_ammo<\/code>)&quot; and watching &quot;<code>ct.get_global_ammo()<\/code>&quot; for the working turret. Neither exists \u2014 see the corrections in <a href=\"01-meet-the-turrets.md\">step 1<\/a> through <a href=\"03-the-ammo-gap.md\">step 3<\/a>. The bullet above reflects what actually made it work: a Conveyor delivering titanium directly to the turret.<\/p>\n<\/blockquote>\n<p>The combination you built in this tutorial \u2014 a Harvester for income, a Gunner guarding it and fed by a Conveyor, and a Builder Bot that wired the two together \u2014 is a real, if small, piece of a competitive bot. Everything from here is about connecting more pieces like it and coordinating them.<\/p>\n<p>Next up: <a href=\"../comms-strategy/01-the-global-communication-store.md\">Coordination &amp; Strategy<\/a> \u2014 use the Global Communication Store to let multiple Builder Bots share information, and put together a bot that combines everything from all four tutorials.<\/p>\n"}, {"id": "comms-strategy/01-the-global-communication-store", "chapter": "Comms & Strategy", "title": "Coordination & Strategy \u00b7 Step 1 of 4", "name": "The Global Communication Store", "body": "<h1>Coordination &amp; Strategy \u00b7 Step 1 of 4<\/h1>\n<h2>The Global Communication Store<\/h2>\n<p>Every unit you've written so far has acted alone \u2014 a Builder Bot only knows what it can personally see. The Global Communication Store is a shared blackboard: 16 integer slots (indexed 0\u201315), readable and writable by every unit on your team.<\/p>\n<pre><code class=\"language-python\">ct.write_store(0, 42)\nvalue = ct.read_store(0)\n<\/code><\/pre>\n<p>There's one timing rule that matters more than anything else about the Store: writes are buffered. A write made this round isn't visible until the next round \u2014 not even to the unit that made it.<\/p>\n<pre><code class=\"language-python\"># Core, round N:\nct.write_store(0, 42)\nvalue = ct.read_store(0)  # still 0 -- this round's snapshot hasn't changed\n\n# Any unit, round N+1:\nvalue = ct.read_store(0)  # now 42\n<\/code><\/pre>\n<p>This is deliberate, not a quirk to work around: it guarantees every unit sees a consistent snapshot of the Store for the entire round, no matter what order units happen to execute in. Design your protocol around the one-round lag rather than fighting it \u2014 and give your slots names instead of leaving magic numbers scattered through your code:<\/p>\n<pre><code class=\"language-python\">SLOT_ORE_X = 0\nSLOT_ORE_Y = 1\n<\/code><\/pre>\n<p>Next: put the Store to work letting Builder Bots share what they've found.<\/p>\n"}, {"id": "comms-strategy/02-coordinating-roles", "chapter": "Comms & Strategy", "title": "Coordination & Strategy \u00b7 Step 2 of 4", "name": "Coordinating roles", "body": "<h1>Coordination &amp; Strategy \u00b7 Step 2 of 4<\/h1>\n<h2>Coordinating roles<\/h2>\n<p>Back in Tutorial 2, every Builder Bot searched for ore entirely on its own \u2014 fine with one bot, wasteful with many, since each one re-discovers the same patches independently instead of splitting up. Let's have any bot that spots an uncovered ore tile broadcast it, so bots with nothing in sight can head toward a real target instead of wandering randomly.<\/p>\n<pre><code class=\"language-python\">import random\n\nfrom fcode import Controller, Direction, Environment, EntityType, Position\n\nCARDINALS = [Direction.NORTH, Direction.SOUTH, Direction.EAST, Direction.WEST]\n\nSLOT_ORE_X = 0\nSLOT_ORE_Y = 1\n\nclass Player:\n    def run(self, ct: Controller) -&gt; None:\n        etype = ct.get_entity_type()\n        if etype == EntityType.CORE:\n            for pos in ct.get_nearby_tiles(dist_sq=2):\n                if ct.can_spawn(pos):\n                    ct.spawn_builder(pos)\n                    break\n        elif etype == EntityType.BUILDER_BOT:\n            self._run_builder(ct)\n\n    def _run_builder(self, ct: Controller) -&gt; None:\n        pos = ct.get_position()\n        self._share_ore(ct, pos)\n\n        for tile in ct.get_nearby_tiles(dist_sq=2):\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.can_build_harvester(tile):\n                ct.build_harvester(tile)\n                return\n\n        ore_tiles = [\n            t for t in ct.get_nearby_tiles() if ct.get_tile_env(t) == Environment.ORE_TITANIUM\n        ]\n        if ore_tiles:\n            target = min(ore_tiles, key=lambda t: pos.distance_squared(t))\n        else:\n            shared_x, shared_y = ct.read_store(SLOT_ORE_X), ct.read_store(SLOT_ORE_Y)\n            target = Position(shared_x, shared_y) if (shared_x or shared_y) else None\n\n        if target is not None:\n            direction = pos.direction_to(target)\n            if ct.can_move(direction):\n                ct.move(direction)\n                return\n\n        open_dirs = [\n            d for d in CARDINALS\n            if ct.can_move(d) and ct.get_tile_env(pos.add(d)) == Environment.EMPTY\n        ]\n        move_options = open_dirs or [d for d in CARDINALS if ct.can_move(d)]\n        if move_options:\n            ct.move(random.choice(move_options))\n\n    def _share_ore(self, ct: Controller, pos: Position) -&gt; None:\n        for tile in ct.get_nearby_tiles():\n            if ct.get_tile_env(tile) == Environment.ORE_TITANIUM and ct.get_tile_building_id(tile) is None:\n                ct.write_store(SLOT_ORE_X, tile.x)\n                ct.write_store(SLOT_ORE_Y, tile.y)\n                return\n<\/code><\/pre>\n<p><code>_share_ore<\/code> runs first, every round, for every Builder Bot: the moment any of them sees an ore tile with nothing built on it, its position goes into slots 0 and 1. Any bot that can't see ore itself falls back to reading that shared location instead of wandering \u2014 <code>(shared_x or shared_y)<\/code> is a cheap way to distinguish &quot;nothing's been shared yet&quot; (both slots still at their default 0) from a real coordinate.<\/p>\n<p>This is a genuinely simple protocol \u2014 one shared target, overwritten by whoever last saw ore, no negotiation about who should actually go there. Multiple bots can and will pile onto the same tile. That's fine for now; the Store gives you the primitive, and how you use those 16 slots is entirely up to your own strategy.<\/p>\n<h2>Try it<\/h2>\n<pre><code>fcode run starter starter\nfcode watch replay.replay26\n<\/code><\/pre>\n<p>What you should see: Builder Bots that start with no ore in sight beelining toward a specific spot instead of wandering, once any teammate has spotted ore somewhere on the map.<\/p>\n<p>Next: merge this with everything from the last three tutorials into one bot.<\/p>\n"}, {"id": "comms-strategy/03-putting-it-together", "chapter": "Comms & Strategy", "title": "Coordination & Strategy \u00b7 Step 3 of 4", "name": "Putting it all together", "body": "<h1>Coordination &amp; Strategy \u00b7 Step 3 of 4<\/h1>\n<h2>Putting it all together<\/h2>\n<p>Everything from Tutorials 1 through 5 fits into one bot: sense the map, harvest ore, route it to the Core with a conveyor cha
