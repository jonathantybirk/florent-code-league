# DTU HPC settings for the tournament harness. See docs/hpc/ for where these numbers come from.

host = "dtu"                              # ssh alias from ~/.ssh/config (login1.gbar.dtu.dk)
scratch_root = "/work3/s234842"           # assigned by DTU HPC support; mode 0700
remote_root = "/work3/s234842/florent-tournament"
queue = "hpc"

# Per-array cap on concurrently running elements. The `hpc` queue caps a user at ~100-120
# processes overall (docs/hpc/queues.md), and that cap is what actually binds -- a large schedule
# is split across several arrays (LSF allows at most 1000 elements each), so the nominal total is
# throttle x number-of-arrays. LSF holds the excess as PEND rather than over-running the queue
# limit, so this is a courtesy bound per array, not the real concurrency.
throttle = 100

# Matches per array element. Recomputed 2026-08-10 from 702,474 recorded match durations across
# 54 schedules, using every fully-observed contiguous window (so this measures the actual fast
# tail, not just averages):
#   300 matches: minimum 606.4s (10.11m) -- unsafe
#   400 matches: minimum 821.7s (13.70m) -- unsafe
#   450 matches: minimum 928.5s (15.47m) -- too little margin
#   500 matches: minimum 1037.9s (17.30m)
#   600 matches: minimum 1254.1s (20.90m)
# A hard minimum of 500 is therefore the smallest measured size with useful margin over 15m;
# 600 is the normal target. Work is balanced instead of leaving a short ragged tail. A remainder
# below 500 is finished locally and is never submitted as a short HPC job.
chunk = 600
minimum_matches_per_job = 500

# Fail closed if real behavior contradicts the sizing estimate. Each element records its elapsed
# workload time under <run>/runtime. An element below 15 minutes writes a durable `short_` marker,
# cancels its own LSF array, and prevents automation from re-submitting that run.
minimum_runtime_seconds = 900

# Walltime is a HARD KILL and must cover a whole element. It is now budgeted on the p99 of a real
# batch, not on chunk x the slowest match ever seen -- the old rule assumed every match in an
# element could simultaneously be the worst one, which by 2026-08-06 demanded 7 hours for chunk=20
# and would have forced chunk=1.
#
# Re-measured 2026-08-06 over 7,507 real contiguous batches of 10 drawn from 75,086 matches on the
# 33-map v3 pool, with spar_econ retired:
#   batch of 10:  median 81s   p95 216s   p99 315s   p99.9 450s   max 502s
# The per-match budget is the observed MAXIMUM plus 10%: 502s x 1.1 / 10, rounded up to 56s.
# Balanced batches can be as large as 999 around the one-element/two-element boundary, requiring
# 933 minutes under that deliberately conservative linear bound; 960 minutes leaves headroom.
# The previous constants (mean 8.8s, max 64s) were
# measured on a bot population that no longer exists and were wrong by 19x at the tail; that is
# what killed 108 elements in v3-newmaps-20260806 alone.
#
# A margin over the observed max, rather than a percentile, because the tail is what actually
# costs: a killed element is not just its own work lost, it is a re-queue cycle, and three of
# those exhaust MAX_RESUBMITS and stall the run for a human to sort out.
#
# Nothing is lost permanently when an element is killed anyway: its matches simply have no result
# file, `hpc submit` re-queues exactly those, resubmit_abandoned_runs() does it automatically, and
# each retry now escalates the walltime (see RESUBMIT_WALLTIME_FACTOR) so a batch that outgrew
# this budget gets room rather than dying at the same wall three times.
walltime = "960"
memory = "2GB"        # per core; measured max RSS is 193 MB, so this is ample headroom.

# One core, and only one. A match cannot use more: the engine runs both bots in CPython
# sub-interpreters that share a single GIL inside one process. Measured CPU/wall efficiency is
# ~84% of one core (the rest is startup I/O). Asking for more cores per element would not speed
# anything up -- the binding constraint is the ~100-120 per-user *slot* cap, so 25 elements x 4
# cores buys exactly the same concurrency as 100 elements x 1 core, while being harder to
# schedule on a busy cluster.
cores = 1
