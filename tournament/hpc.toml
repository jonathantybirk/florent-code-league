# DTU HPC settings for the tournament harness. See docs/hpc/ for where these numbers come from.

host = "dtu"                              # ssh alias from ~/.ssh/config (login1.gbar.dtu.dk)
scratch_root = "/work3/s234842"           # assigned by DTU HPC support; mode 0700
remote_root = "/work3/s234842/florent-tournament"
queue = "hpc"

# Total match processes the submitter may request.
#
# Re-checked 2026-08-21 on gbarlogin1: `busers s234842` reports MAX = "-" (no per-user slot cap)
# and queue `hpc` reports TASKLIMIT = 128, so the three-core restriction DTU support applied while
# they reviewed the repaired pipeline is no longer enforced in LSF. 96 leaves headroom under the
# 128 task limit rather than racing the queue's own ceiling.
#
# Raising this cannot reintroduce the short jobs that caused the restriction. Worker count is
# derived from the work itself in balanced_batches(): every slot is sized at `chunk` matches and
# refused below `minimum_matches_per_worker`, and worker_worklists() then takes
# min(len(batches), max_worker_slots) -- this number can only ever *reduce* the worker count, never
# split the work into smaller pieces. The runtime guard below is the second line of defence.
max_worker_slots = 96

# Pack worker slots into long multi-core LSF jobs. The controller in each job dynamically hands
# the next match to whichever core becomes free, eliminating static-batch stragglers while each
# match still gets its own fresh one-core OS process. Keep this at or below max_worker_slots.
#
# Eight rather than the full 96: a job only starts once its whole core count is free at the same
# time, so wide jobs sit pending behind the queue. Twelve 8-core jobs start in a fraction of the
# time one 96-core job would, and the dynamic worklist means a job that starts early simply does
# more matches.
workers_per_job = 8

# Target matches per worker slot. Recomputed 2026-08-10 from 702,474 recorded durations across
# 54 schedules, using every fully-observed contiguous window (so this measures the actual fast
# tail, not just averages):
#   300 matches: minimum 606.4s (10.11m) -- unsafe
#   400 matches: minimum 821.7s (13.70m) -- unsafe
#   450 matches: minimum 928.5s (15.47m) -- too little margin
#   500 matches: minimum 1037.9s (17.30m)
#   600 matches: minimum 1254.1s (20.90m)
# A hard minimum of 500 is therefore the smallest measured size with useful margin over 15m;
# 600 is the normal target. Worker slots are striped across the schedule and dynamically share
# their LSF job's worklist. A remainder below 500 is finished locally and is never submitted as a
# short HPC job.
chunk = 600
minimum_matches_per_worker = 500

# Fail closed if real behavior contradicts the sizing estimate. Each worker job records its elapsed
# workload time under <run>/runtime. A job below 15 minutes writes a durable `short_` marker,
# signals sibling jobs to stop taking work, and prevents automation from re-submitting that run.
minimum_runtime_seconds = 900

# Walltime is a HARD KILL and must cover a whole worker job. It is budgeted on the p99 of a real
# batch, not on chunk x the slowest match ever seen -- the old rule assumed every match in an
# element could simultaneously be the worst one, which by 2026-08-06 demanded 7 hours for chunk=20
# and would have forced chunk=1.
#
# Re-measured 2026-08-06 over 7,507 real contiguous batches of 10 drawn from 75,086 matches on the
# 33-map v3 pool, with spar_econ retired:
#   batch of 10:  median 81s   p95 216s   p99 315s   p99.9 450s   max 502s
# The per-match budget is the observed MAXIMUM plus 10%: 502s x 1.1 / 10, rounded up to 56s.
# Balanced batches can be as large as 999 around the one-element/two-element boundary, requiring
# 933 minutes under that deliberately conservative linear bound; 960 minutes leaves headroom.
# The previous constants (mean 8.8s, max 64s) were
# measured on a bot population that no longer exists and were wrong by 19x at the tail; that is
# what killed 108 elements in v3-newmaps-20260806 alone.
#
# A margin over the observed max, rather than a percentile, because the tail is what actually
# costs: a killed element is not just its own work lost, it is a re-queue cycle, and three of
# those exhaust MAX_RESUBMITS and stall the run for a human to sort out.
#
# Nothing is lost permanently when an element is killed anyway: its matches simply have no result
# file, `hpc submit` re-queues exactly those, resubmit_abandoned_runs() does it automatically, and
# each retry now escalates the walltime (see RESUBMIT_WALLTIME_FACTOR) so a batch that outgrew
# this budget gets room rather than dying at the same wall three times.
walltime = "960"
memory = "2GB"        # per core; measured max RSS is 193 MB, so this is ample headroom.

# One core per MATCH, always. A worker job requests several cores only to run several independent
# match processes concurrently; an individual match cannot use more because both bots execute in
# CPython sub-interpreters sharing one GIL.
cores = 1  # retained for compatibility with older saved/test settings
