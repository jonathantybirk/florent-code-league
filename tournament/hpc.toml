# DTU HPC settings for the tournament harness. See docs/hpc/ for where these numbers come from.

host = "dtu"                              # ssh alias from ~/.ssh/config (login1.gbar.dtu.dk)
scratch_root = "/work3/s234842"           # assigned by DTU HPC support; mode 0700
remote_root = "/work3/s234842/florent-tournament"
queue = "hpc"

# Total match processes the submitter may request.
#
# Re-checked 2026-08-21 on gbarlogin1: `busers s234842` reports MAX = "-" (no per-user slot cap)
# and queue `hpc` reports TASKLIMIT = 128, so the three-core restriction DTU support applied while
# they reviewed the repaired pipeline is no longer enforced in LSF. 96 leaves headroom under the
# 128 task limit rather than racing the queue's own ceiling.
#
# Raising this cannot reintroduce the short jobs that caused the restriction. Worker count is
# derived from the work itself in balanced_batches(): every slot is sized at `chunk` matches and
# refused below `minimum_matches_per_worker`, and worker_worklists() then takes
# min(len(batches), max_worker_slots) -- this number can only ever *reduce* the worker count, never
# split the work into smaller pieces. The runtime guard below is the second line of defence.
max_worker_slots = 96

# Pack worker slots into long multi-core LSF jobs. The controller in each job dynamically hands
# the next match to whichever core becomes free, eliminating static-batch stragglers while each
# match still gets its own fresh one-core OS process. Keep this at or below max_worker_slots.
#
# Eight rather than the full 96: a job only starts once its whole core count is free at the same
# time, so wide jobs sit pending behind the queue. Twelve 8-core jobs start in a fraction of the
# time one 96-core job would, and the dynamic worklist means a job that starts early simply does
# more matches.
workers_per_job = 8

# Target matches per worker slot. Re-measured 2026-08-23 over 507,498 cluster matches, taking
# every contiguous window *within* one (schedule, LSF job) group -- the run a single worker slot
# actually experiences -- and reporting the fastest such window ever recorded:
#   300 matches: fastest 13.3m -- under the floor
#   350 matches: fastest 15.7m -- clears it by 42 seconds, no margin
#   400 matches: fastest 18.1m -- clears it by 3.1m
#   500 matches: fastest 23.2m (the previous minimum)
#   600 matches: fastest 28.4m (the previous target)
# 400 is therefore the smallest size at which no observed worker run finishes inside 15 minutes,
# and target = minimum keeps every job as short as the floor allows: shorter jobs backfill into
# the queue sooner, and the median worker run is still ~44m. Anything below 350 puts jobs under
# 15 minutes, which is what the account was capped for in the first place.
#
# The 2026-08-10 figures this replaces (400 -> 13.70m, 500 -> 17.30m) were measured on a bot
# population that no longer exists; the same windows today run 30% longer. Re-measure before
# moving these numbers again -- and never below 400 without doing so.
chunk = 400
minimum_matches_per_worker = 400

# Fail closed if real behavior contradicts the sizing estimate. Each worker job records its elapsed
# workload time under <run>/runtime. A job below 15 minutes writes a durable `short_` marker,
# signals sibling jobs to stop taking work, and prevents automation from re-submitting that run.
minimum_runtime_seconds = 900

# Walltime is a HARD KILL, requested per job from that job's own busiest core rather than as one
# flat number for every submission. hpc.walltime_minutes() sizes it as
# largest_per_core x BATCH_BUDGET_SECONDS_PER_MATCH x WALLTIME_MARGIN, floored at 60 minutes.
#
# The per-match figure is re-derived (see hpc.py) from the slowest window ever recorded at real
# worker sizes: 29.6s/match at 400, 27.7s at 500, so 31s covers every size we submit, and the
# 15% margin sits on top of an observed maximum rather than a percentile -- a killed job is not
# just its own work lost, it is a re-queue cycle, and three of those exhaust MAX_RESUBMITS.
# A batch of 400 therefore asks for 238 minutes against a 197-minute observed worst case.
#
# The flat 960 this replaces was ~5x what a 400-match worker needs, and LSF cannot backfill a
# 16-hour reservation into a short gap: the first v4 submission sat PEND behind 2,887 queued jobs
# asking eleven times the walltime it would have used. Sizing the request to the work is what
# makes a small run start quickly, and it is why chunk can safely sit at the 15-minute floor.
#
# This cap is a backstop, not the request: a batch needing more than this is refused at submit
# time rather than silently reserving most of a day.
walltime_cap_minutes = "960"
memory = "2GB"        # per core; measured max RSS is 193 MB, so this is ample headroom.

# One core per MATCH, always. A worker job requests several cores only to run several independent
# match processes concurrently; an individual match cannot use more because both bots execute in
# CPython sub-interpreters sharing one GIL.
cores = 1  # retained for compatibility with older saved/test settings
