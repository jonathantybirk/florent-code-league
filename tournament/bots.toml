# Tournament roster. Each bot is pinned by name AND commit; ratings are only
# meaningful if the code behind a name cannot drift.
# 9713344 = the original 34-bot round robin (tid jon-full).
# da3fd8a = Jon's newer work: tempest (new), jonbot/undertow/vanguard (changed code),
# and his commit-addressed version snapshots. The other 31 bots are unchanged at
# da3fd8a apart from an added BOT_VERSION.toml, so they are not re-entered.
# `fair` means the implementation uses only runtime observations and general game
# rules. `unfair` means it reads or embeds data from the published official maps.
# Every registered implementation carries exactly one of these two tags.
#
# 2026-08-04 (leaderboard v2, fcode 2.3.4 turret balance patch): 21 bots below 18% win
# rate were retired for the full re-evaluation -- all of bots/jon/legacy, six of the
# eight archive bots (adaptive_v1 and frontier survive), casemate, and Viktor's green
# and hardshell. Their v1 match data is archived under tournament/runs-v1/. Discovery
# excludes for their paths live in automation.DEFAULT_SOURCES and the systemd unit.

